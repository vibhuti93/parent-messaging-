repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.9.2
          - pydantic-settings>=2.0.0

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (?x)^(uv\.lock|fixtures/.*|tests/fixtures/.*|docs/.*)$

  - repo: local
    hooks:
      - id: guardrails
        name: W3 Invariant Guardrails
        entry: python scripts/guardrails.py
        language: system
        pass_filenames: false

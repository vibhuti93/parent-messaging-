[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-dispatch-engine"
version = "0.1.0"
description = "Deterministic OMR diagnostics and Hindi notification dispatch engine for schools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Educational Technology Team" }]
dependencies = [
    "pydantic>=2.9.2,<3.0.0",
    "pillow>=10.4.0,<13.0.0",
    "playwright>=1.48.0,<2.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "scripts",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

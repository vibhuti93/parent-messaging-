[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-dispatch-engine"
version = "0.1.0"
description = "Deterministic OMR diagnostics and Hindi notification dispatch engine for schools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Educational Technology Team" }]
dependencies = [
    "pydantic>=2.9.2,<3.0.0",
    "pillow>=10.4.0,<13.0.0",
    "playwright>=1.48.0,<2.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Pure in-memory unit tests with zero external I/O (ADR-0012)",
    "integration: Local SQLite WAL, persistence, and pipeline integration tests (ADR-0012)",
    "render: Scorecard PNG and PDF visual generation tests requiring Playwright/fonts (ADR-0011, ADR-0012)",
    "audio: Audio token stitching and FFmpeg transcoding tests (ADR-0011, ADR-0012)",
    "network: Local mock HTTP network provider adapter tests (ADR-0012)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "scripts",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (disallows print in src/)
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
]
ignore = [
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]  # Allow print in CLI utility/guardrail scripts
"tests/*" = ["T201"]    # Allow print in test diagnostics

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Documented per-module exceptions for external untyped third-party libraries (ADR-0014)
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "PIL.*",
    "weasyprint.*",
    "reportlab.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pypdfium2>=5.14.0",
]
